<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260" role="img" aria-label="Fretting-hand finger numbers: 1 index, 2 middle, 3 ring, 4 pinky, T thumb">
  <title>Fretting-hand finger numbers</title>
  <rect x="0" y="0" width="240" height="260" rx="16" fill="#ffffff" />

  <!-- thumb: pivot sits inside the palm, so rotation keeps the base tucked under it -->
  <rect x="25" y="178" width="50" height="24" rx="12" fill="#efe9dd" stroke="#c7bda8" stroke-width="1.5" transform="rotate(35 75 190)" />

  <!-- palm -->
  <rect x="58" y="142" width="112" height="94" rx="32" fill="#efe9dd" stroke="#c7bda8" stroke-width="1.5" />

  <!-- fingers -->
  <rect x="66" y="76" width="22" height="70" rx="11" fill="#efe9dd" stroke="#c7bda8" stroke-width="1.5" />
  <rect x="92" y="60" width="22" height="86" rx="11" fill="#efe9dd" stroke="#c7bda8" stroke-width="1.5" />
  <rect x="118" y="66" width="22" height="80" rx="11" fill="#efe9dd" stroke="#c7bda8" stroke-width="1.5" />
  <rect x="144" y="86" width="20" height="60" rx="10" fill="#efe9dd" stroke="#c7bda8" stroke-width="1.5" />

  <!-- labels -->
  <circle cx="30" cy="158" r="13" fill="#825abe" />
  <text x="30" y="162.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">T</text>

  <circle cx="77" cy="64" r="13" fill="#825abe" />
  <text x="77" y="68.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">1</text>

  <circle cx="103" cy="48" r="13" fill="#825abe" />
  <text x="103" y="52.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">2</text>

  <circle cx="129" cy="54" r="13" fill="#825abe" />
  <text x="129" y="58.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">3</text>

  <circle cx="154" cy="74" r="13" fill="#825abe" />
  <text x="154" y="78.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">4</text>

  <text x="120" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b6153">Thumb (T) to pinky (4)</text>
</svg>
